name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 60

      - name: Check application health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://amva-salud-adolescente.vercel.app/api/health"
          for attempt in {1..10}; do
            echo "Health check attempt $attempt"
            if body="$(curl --fail --silent --show-error --max-time 15 "$URL")"; then
              echo "$body"
              echo "$body" | grep -q '"ok":true'
              echo "$body" | grep -q '"database":"connected"'
              break
            fi
            if [ "$attempt" -eq 10 ]; then exit 1; fi
            sleep 15
          done

      - name: Check production dashboard data
        shell: bash
        run: |
          set -euo pipefail
          URL="https://amva-salud-adolescente.vercel.app/api/dashboard/summary?year=2026"
          body="$(curl --fail --silent --show-error --max-time 20 "$URL")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -Eq '"morbidity":[1-9][0-9]*'
          echo "$body" | grep -Eq '"mortality":[1-9][0-9]*'
          echo "$body" | grep -Eq '"population":[1-9][0-9]*'
